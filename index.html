
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Arial, sans-serif;
}

.lyrics-panel {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 18px 30px;
}

.current {
  color: #FFFF00;
  font-size: 34px;
  font-weight: 800;
  line-height: 1.3;
  text-shadow:
    0 2px 3px #000,
    0 0 8px rgba(255, 190, 70, .8),
    2px 3px 5px #000;
  transition: opacity .25s ease, transform .25s ease;
}

.next {
  margin-top: 12px;
  color: rgba(255, 255, 255, .75);
  font-size: 21px;
  font-weight: 600;
  line-height: 1.3;
  text-shadow: 0 2px 4px #000;
  transition: opacity .25s ease;
}

.hidden {
  opacity: 0;
  transform: translateY(8px);
}
</style>
</head>

<body>
<div class="lyrics-panel">
  <div id="current" class="current"></div>
  <div id="next" class="next"></div>
</div>

<script>
const currentEl = document.getElementById("current");
const nextEl = document.getElementById("next");

let lastText = "";

async function updateLyrics() {
  try {
    const response = await fetch("/lyrics?t=" + Date.now(), {
      cache: "no-store"
    });

    if (!response.ok) return;

    const data = await response.json();

    if (!data.active || !data.text) return;

    if (data.text !== lastText) {
      lastText = data.text;

      currentEl.classList.add("hidden");
      nextEl.classList.add("hidden");

      setTimeout(() => {
        currentEl.textContent = data.text;
        nextEl.textContent = data.nextText || "";

        currentEl.classList.remove("hidden");
        nextEl.classList.remove("hidden");
      }, 180);
    }
  } catch (error) {
    console.log("Menunggu data lirik...");
  }
}

updateLyrics();
setInterval(updateLyrics, 250);
</script>
</body>
</html>
